<script>
  function applyLanguage(lang) {
    document.querySelectorAll("[data-ro]").forEach(el => {
      el.textContent = el.getAttribute(`data-${lang}`);
    });

    // schimbăm steagul în funcție de limba curentă
    const flag = document.getElementById("langFlag");
    flag.src = lang === "ro" ? "img/uk.svg" : "img/ro.png";

    localStorage.setItem("lang", lang);
  }

  document.getElementById("langBtn").addEventListener("click", () => {
    const current = localStorage.getItem("lang") || "ro";
    const next = current === "ro" ? "en" : "ro";
    applyLanguage(next);
  });

  // Limba salvată
  const saved = localStorage.getItem("lang") || "ro";
  applyLanguage(saved);
</script>
